<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>划词AI释义 · 历史记录</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-soft: rgba(99, 102, 241, 0.12);
      --border: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --page-bg: #eef2ff;
      --quote-bg: #e0e7ff;
      --font-color: #1f2937;
      --font-size: 13px;
      --main-font-size: 13px;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Roboto, sans-serif;
      --line-height: 1.2;
      --main-line-height: 1.7;
      --main-bg: #f4f4fe;
      --main-border: #6366f1;
      --extract-bg: #dcfce7;
      --extract-border: #39ac61;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      /* 插件自身界面固定用系统字体与深灰字色；显示设置的字体族/字色只作用于记录区 #list */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Roboto, sans-serif;
      color: #1f2937;
      font-size: var(--font-size);
      /* 页面底色只作用于记录区（#list），工具栏与设置区始终是插件自己的浅色界面 */
      background: #f4f5fa;
      min-height: 100vh;
      padding: 32px 16px 60px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
    h1 .clear-link {
      margin-left: 2px; font-size: 12px; font-weight: 400; color: var(--muted);
      border: none; background: none; cursor: pointer; padding: 3px 8px; border-radius: 6px;
    }
    h1 .clear-link:hover { color: #dc2626; background: rgba(220, 38, 38, 0.08); }
    /* 标题栏的刷新图标按钮 */
    h1 .icon-btn {
      margin-left: auto; /* 独占标题行最右，就是原来「清空记录」的位置 */
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; padding: 0; border: 0; border-radius: 7px;
      background: transparent; color: var(--muted); font-size: 15px; line-height: 1;
      cursor: pointer; transition: transform 0.2s ease, color 0.2s ease;
    }
    h1 .icon-btn:hover { color: var(--primary); background: rgba(99, 102, 241, 0.1); transform: rotate(180deg); }
    h1 .dot {
      flex: 0 0 auto; /* 圆点不允许被 flex 压缩成椭圆 */
      width: 12px; height: 12px; border-radius: 50%;
      background: #6366f1; /* 打底纯色：渐变在打印光栅化时可能漏边，纯色兜底 */
      background-image: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    @media print {
      /* 打印时用纯色填充，避免圆点边缘被裁掉一圈 */
      h1 .dot { background-image: none; background: #6366f1; }
    }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }

    /* 工具栏允许换行，但按钮行永远不折：空间不够时只压搜索框 */
    .toolbar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }
    .toolbar > button, .toolbar .count { flex: 0 0 auto; }
    /* 基准宽度设为 0：搜索框只吃剩余空间，绝不把按钮挤到下一行 */
    .search-wrap { position: relative; flex: 1 1 0; min-width: 120px; }
    /* 工具栏按钮收紧左右内边距，给统计信息腾位置，减少换行；统一高度避免短文案（MD）显得矮一截 */
    .toolbar button.primary, .toolbar button.ghost {
      padding-left: 12px; padding-right: 12px;
      min-height: 34px; line-height: 1.25;
      display: inline-flex; align-items: center; justify-content: center;
      box-sizing: border-box;
    }
    .search {
      width: 100%;
      padding: 8px 30px 8px 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    .search:focus { border-color: var(--primary); }
    .search-clear {
      position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
      display: none; align-items: center; justify-content: center;
      width: 20px; height: 20px; padding: 0;
      border: none; background: none; cursor: pointer;
      color: var(--muted); font-size: 13px; line-height: 1; border-radius: 50%;
    }
    .search-clear:hover { color: var(--text); background: rgba(0, 0, 0, 0.06); }
    /* 统计信息文案已缩短（12/30），固定不收缩，换行压力交给搜索框 */
    .count {
      font-size: 12px; color: var(--muted); white-space: nowrap;
      flex: 0 0 auto; text-align: right;
    }

    .opts {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      column-gap: 14px; row-gap: 6px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 12px;
      padding: 10px 16px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .opts.timebar { overflow: visible; }
    /* 筛选与风格行并进搜索工具栏那张卡：占满整行，不画分割线 */
    .toolbar .opts-group {
      flex-basis: 100%; width: 100%;
      background: transparent; border: 0; border-radius: 0; box-shadow: none;
      padding: 2px 0 0; margin: 0;
    }
    /* 时间范围 / 标签 / 风格模板依次排列，行内透明、用细虚线分隔 */
    .opts-group { display: block; padding: 10px 16px; }
    .opts-group > .opts {
      background: transparent; border: 0; border-radius: 0;
      padding: 0; margin-bottom: 0;
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      row-gap: 6px;
    }
    /* 筛选卡三行之间留一点呼吸空间（上下各 5px，合计约 10px） */
    .toolbar .opts-group > .opts { padding: 5px 0; }
    /* 只有设置区那张合并卡在行间加细虚线分隔；筛选卡（时间范围 / 标签 / 风格模板）不加间距 */
    #settingsArea .opts-group > .opts + .opts:not([hidden]) {
      border-top: 1px dashed rgba(15, 23, 42, 0.08);
      margin-top: 6px; padding-top: 10px;
    }
    /* 时间范围与标签同属筛选，两行之间不画分隔线、也不留额外间距 */
    .opts-group > .opts.tagbar { border-top: 0 !important; margin-top: 0; padding-top: 0; }
    /* 折叠面板展开后与原样式一致（不缩进，避免宽度被收窄后换行变多） */
    .opts.opt-panel { padding: 2px 0; row-gap: 7px; }
    .opts.opt-panel[hidden] { display: none !important; }
    /* 折叠条：整行可点，右侧一个尖角图标表示展开 / 收起 */
    .opts.panel-row { padding: 0; }
    .panel-toggle {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
      width: 100%; padding: 9px 0; border: 0; background: transparent;
      font-family: inherit; font-size: 12px; color: var(--muted); cursor: pointer;
    }
    .panel-toggle:hover { color: var(--primary); }
    .panel-toggle-title { justify-self: start; letter-spacing: 0.02em; }
    /* 展开状态文字居中显示，收起时「打开」、展开后「折叠」 */
    .panel-toggle-state {
      justify-self: center; font-size: 12px; color: var(--muted);
      padding: 0 6px; letter-spacing: 0.05em;
    }
    .panel-toggle:hover .panel-toggle-state { color: var(--primary); }
    /* 时间行没有可伸缩的占位元素，靠 margin-left:auto 把「清除」推到行尾，与标签行的观感一致 */
    .opts.timebar #timeClear { margin-left: auto; }
    .opts.timebar .opts-hint { flex: 0 0 auto; color: var(--primary); font-size: 12px; }
    .opts.timebar .quick-links { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; }
    .opts.timebar .quick-link { cursor: pointer; color: var(--muted); text-decoration: none; width: 25px; text-align: center; border-radius: 5px; }
    .opts.timebar .quick-link:hover { color: var(--primary); background: rgba(99, 102, 241, 0.1); }
    .opts.timebar .quick-sep { color: var(--border); }
    .opts-title {
      color: var(--muted); font-size: 12px;
      width: 80px; flex-shrink: 0;
    }
    .opts-br { flex-basis: 100%; width: 100%; height: 0; }
    /* 小标题旁的带圈 i：只用悬浮提示补充说明 */
    .info-dot {
      display: inline-block; margin-left: 2px; color: #9aa3b2;
      font-size: 13px; line-height: 1; cursor: help; vertical-align: -1px;
    }
    .opts-sep { border-top: 1px dashed var(--border); margin: 5px 0;}
    .opts-toggle-row {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 14px; flex-basis: 100%;
    }
    .opts label {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--text); cursor: pointer; user-select: none;
      /* 勾选项统一字号/字重/行高，避免短标签（条数、标签、分隔线）看起来与前后不一致 */
      font-size: 13px; font-family: inherit; font-weight: 400; line-height: 1.4;
    }
    .opts input { accent-color: var(--primary); cursor: pointer; }
    .opts input[type="checkbox"] { margin: 0; width: 13px; height: 13px; flex: 0 0 auto; }
    /* 输入框里的浅灰提示文字比正文小一号 */
    .opts input::placeholder, .opts textarea::placeholder { font-size: 11.5px; color: var(--muted); }
    .search::placeholder { font-size: 12px; color: var(--muted); }
    /* 设置控件：与搜索框一致的浅色外观 */
    .opts select,
    .opts input[type="text"],
    .opts input[type="date"],
    .opts input[type="datetime-local"] {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }
    .opts select:focus,
    .opts input[type="text"]:focus,
    .opts input[type="date"]:focus,
    .opts input[type="datetime-local"]:focus { border-color: var(--primary); }
    /* 日期类输入框：统一宽度、数字等宽、日历图标弱化成灰线，避免浏览器默认控件显脏 */
    .opts input[type="date"],
    .opts input[type="datetime-local"] {
      width: 108px; min-width: 0;
      font-size: 12px; font-variant-numeric: tabular-nums;
      height: 26px; padding: 2px 6px 2px 8px; line-height: 1.2;
    }
    .opts input[type="datetime-local"] { width: 190px; }
    .opts input[type="date"]::-webkit-calendar-picker-indicator,
    .opts input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      opacity: 0.45; cursor: pointer; margin-left: 2px;
    }
    .opts input[type="date"]::-webkit-calendar-picker-indicator:hover,
    .opts input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover { opacity: 0.8; }
    /* 聚焦时文字用深色，未选值的占位由浏览器自己画成灰色 */
    .opts input[type="date"]:focus,
    .opts input[type="datetime-local"]:focus { color: var(--text); }
    .opts input[type="color"] {
      width: 40px; height: 26px; padding: 2px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
    }
    .opts input[type="range"] { width: 73px; }
    /* 下拉框与其选项的字号比输入框小一号（放在控件规则之后，避免被 13px 覆盖） */
    .opts select, .opts select option { font-size: 12px; }
    .opts-hint { color: var(--muted); font-size: 12px; }
    .opts .reset-btn {
      border: 1px solid var(--border); background: #fff; color: var(--muted);
      font-size: 12px; padding: 4px 10px; border-radius: 7px; cursor: pointer;
    }
    .opts .reset-btn:hover { color: var(--primary); border-color: var(--primary); }
    .opts .reset-btn.active { color: var(--primary); border-color: var(--primary); background: rgba(99, 102, 241, 0.08); }
    .opts .btn-mini {
      border: 1px solid var(--border); background: #fff; color: var(--muted);
      font-size: 11px; padding: 1px 7px; border-radius: 6px; cursor: pointer; line-height: 1.6;
    }
    .opts .btn-mini:hover { color: var(--primary); border-color: var(--primary); }
    .agg-items { display: flex; flex-direction: column; gap: 10px; }
    .agg-item { border-top: 1px dashed rgba(99, 102, 241, 0.28); padding-top: 10px; }
    .agg-item:first-child { border-top: none; padding-top: 0; }
    .agg-item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .agg-item-time { font-size: 12px; color: var(--muted); flex: 1 1 auto; white-space: nowrap; }
    .bg-swatches { display: inline-flex; gap: 4px; align-items: center; }
    .bg-swatch {
      width: 16px; height: 16px; padding: 0; border-radius: 4px; cursor: pointer;
      border: 1px solid rgba(0, 0, 0, 0.12); flex: 0 0 auto;
    }
    .bg-swatch:hover { transform: scale(1.15); }
    .bg-swatch.active { outline: 2px solid var(--primary); outline-offset: 1px; }
    /* 显示设置第一行：字体/字体颜色/字体大小 缩窄 */
    #optFontPreset { max-width: 132px; }
    #optFontFamily { width: 150px; }
    #presetSelect { min-width: 260px; }

    button.primary, button.ghost, button.danger {
      border: none; cursor: pointer; font-size: 13px;
      padding: 9px 16px; border-radius: 9px; transition: 0.15s; white-space: nowrap;
    }
    button.primary { background: var(--primary); color: #fff; }
    button.primary:hover { background: #4338ca; }
    button.ghost { background: var(--primary-soft); color: var(--primary); }
    button.ghost:hover { background: rgba(99, 102, 241, 0.2); }
    /* 设置按钮的“打开/关闭”用按下态表示：显示时实心紫，隐藏时淡紫 */
    #toggleSettings.is-on { background: var(--primary); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
    /* 只读模式：卡片里不出现任何操作图标（含＋标签），标签也不再能点掉 */
    #toggleReadonly.is-on { background: var(--primary); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
    body.readonly .item-head,
    body.readonly .item-tag-add,
    body.readonly .item-move,
    body.readonly .item-del,
    body.readonly #clear,
    body.readonly #import { display: none !important; }
    body.readonly .item-tags .item-tag { cursor: default; }
    body.readonly .item-tags .item-tag:hover {
      background: rgba(99, 102, 241, 0.14); border-color: rgba(99, 102, 241, 0.3); color: #4338ca;
    }
    button.danger { background: rgba(220, 38, 38, 0.1); color: #dc2626; }
    button.danger:hover { background: rgba(220, 38, 38, 0.18); }
    /* 样式设置行里的字段名（字体/字体颜色/字体大小/行高）与「页面背景色」这类小标题同字号同色 */
    .opts label.opt-lbl { font-size: 12px; color: var(--muted); gap: 6px; }
    /* 展开面板不再缩进，换行后的字段与第一行左对齐即可 */
    .opts label.opt-rowstart { margin-left: 0; }
    /* 记录区：样式设置里的「页面背景色」与风格模板的底色都只落在这里，不影响工具栏/设置区 */
    #list {
      background: var(--page-bg);
      border-radius: 16px;
      padding: 16px 16px 4px;
      font-family: var(--font-family);
      color: var(--font-color);
    }
    #list:empty { display: none; }

    .card {
      background: rgba(255, 255, 255, 0.88);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: var(--card-radius, 16px);
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
    }
    .item-head {
      display: flex; align-items: center; gap: 10px; flex-wrap: nowrap;
      /* 操作图标行整体上移一点，下面用一道淡实线跟时间/来源行分开 */
      margin: -12px 0 10px; padding-bottom: 2px;
      border-bottom: 1px solid rgba(15, 23, 42, 0.07);
    }
    /* 时间不占富余空间：来源紧跟其后靠左，按钮组才靠右 */
    .item-time { font-size: 12px; color: var(--muted); flex: 0 0 auto; white-space: nowrap; }
    .item-tag {
      flex: 0 0 auto; font-size: 11px; line-height: 1.4; padding: 1px 7px;
      border-radius: 999px; color: #4338ca;
      background: rgba(99, 102, 241, 0.14);
      border: 1px solid rgba(99, 102, 241, 0.3);
      white-space: nowrap;
    }
    /* 每张卡片上的标签行：点标签即移除，＋ 可新增 */
    /* 标签行本体：默认靠右，放在来源那一行的行尾 */
    .item-tags {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 6px; flex-wrap: wrap; margin: 0 0 8px; margin-left: auto;
    }
    /* 第二行：来源居左，标签推到最右 */
    .item-meta {
      display: flex; align-items: center; gap: 10px;
      margin: 0 0 8px; min-width: 0;
    }
    .item-meta .item-tags { margin: 0 0 0 auto; flex: 0 1 auto; }
    .item-tags .item-tag { cursor: pointer; }
    .item-tags .item-tag:hover { background: rgba(220, 38, 38, 0.12); border-color: rgba(220, 38, 38, 0.35); color: #b91c1c; }
    .item-tag-add {
      font-size: 11px; padding: 1px 7px; border-radius: 999px; cursor: pointer;
      border: 1px dashed rgba(99, 102, 241, 0.45); background: transparent; color: #6366f1;
      font-family: inherit;
    }
    .item-tag-add:hover { background: rgba(99, 102, 241, 0.1); }
    .item-tag-input {
      font-family: inherit; font-size: 12px; font-weight: 400; padding: 2px 8px; width: 120px;
      height: 22px; line-height: 18px; color: #374151; background: #fff;
      border: 1px solid rgba(99, 102, 241, 0.35); border-radius: 999px;
      outline: none; box-shadow: none; appearance: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .item-tag-input::placeholder { color: #9ca3af; }
    .item-tag-input:focus {
      border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.15);
    }
    /* 标签输入框的候选下拉（body 下、视口坐标定位，点 ＋标签 即弹出） */
    .item-tag-menu {
      position: fixed; z-index: 9999; width: 160px; max-height: 200px; overflow-y: auto;
      padding: 4px; border-radius: 8px; background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.1); box-shadow: 0 8px 24px rgba(15, 23, 42, 0.16);
    }
    .item-tag-menu-item {
      display: block; width: 100%; text-align: left; font-family: inherit; font-size: 12px;
      padding: 4px 8px; border: 0; border-radius: 6px; background: transparent;
      color: #374151; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-tag-menu-item:hover { background: rgba(99, 102, 241, 0.12); color: #4338ca; }
    /* 标签筛选条 */
    .tagbar[hidden] { display: none !important; }
    /* 风格模板：一排小胶囊 */
    .tpl-bar { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; align-content: flex-start; }
    /* 风格模板：与上面几行同构——字段名固定左栏，选项值在右栏内部换行。
       用 grid 而不是 flex，避免按钮一多整块被挤到下一行变成「独立一行」 */
    .opts.tpl-row {
      display: grid; grid-template-columns: auto minmax(0, 1fr);
      align-items: start; column-gap: 14px; row-gap: 0;
    }
    .tpl-btn {
      font-family: inherit; font-size: 12px; line-height: 1; padding: 5px 10px; cursor: pointer;
      border-radius: 999px; border: 1px solid rgba(99, 102, 241, 0.3);
      background: rgba(99, 102, 241, 0.08); color: #4338ca; transition: 0.15s;
    }
    .tpl-btn:hover { background: rgba(99, 102, 241, 0.18); }
    .tpl-btn.active { background: #6366f1; border-color: #6366f1; color: #fff; font-weight: 600; }
    /* 「或 / 且」互斥模式切换 */
    .tag-mode { display: inline-flex; border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 999px; overflow: hidden; }
    .tag-mode-btn {
      font-family: inherit; font-size: 11px; line-height: 1; padding: 3px 6px; cursor: pointer;
      border: 0; background: transparent; color: #6366f1;
    }
    .tag-mode-btn.active { background: #6366f1; color: #fff; }
    .tag-mode-btn:not(.active):hover { background: rgba(99, 102, 241, 0.12); }
    .tag-filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; }
    .tag-chip {
      font-size: 12px; padding: 2px 7px; border-radius: 999px; cursor: pointer;
      border: 1px solid rgba(99, 102, 241, 0.3); background: rgba(99, 102, 241, 0.08);
      color: #4338ca; font-family: inherit;
    }
    .tag-chip.active { background: #6366f1; border-color: #6366f1; color: #fff; }
    .tag-chip:hover { background: rgba(99, 102, 241, 0.24); }
    .tag-chip.active:hover { background: #4f46e5; }
    /* 「无标签」用灰色调，和真实标签区分开 */
    .tag-chip-untagged { border-color: rgba(107, 114, 128, 0.35); background: rgba(107, 114, 128, 0.1); color: #6b7280; }
    .tag-chip-untagged:hover { background: rgba(107, 114, 128, 0.22); }
    .tag-chip-untagged.active { background: #6b7280; border-color: #6b7280; color: #fff; }
    .tag-chip-untagged.active:hover { background: #4b5563; }
    .item-src {
      font-size: 12px; color: var(--muted); flex: 1 1 auto;
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* 卡片头部行尾的按钮组：靠右、间距统一 */
    .item-actions {
      display: inline-flex; align-items: center; gap: 6px;
      flex: 0 0 auto; margin-left: auto;
    }
    .item-src a { color: var(--muted); text-decoration: none; }
    .item-src a:hover { color: var(--primary); text-decoration: underline; }
    .item-src-search {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; padding: 0; margin: 0;
      border: none; background: none; cursor: pointer;
      color: var(--muted); border-radius: 5px; flex: 0 0 auto;
    }
    .item-src-search:hover { color: var(--primary); background: rgba(99, 102, 241, 0.1); }
    /* 改来源文本：小铅笔按钮 + 就地输入框 */
    .item-src-edit {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; padding: 0; margin: 0; flex: 0 0 auto;
      border: none; background: none; cursor: pointer;
      border-radius: 5px; color: var(--muted); transition: 0.15s;
    }
    .item-src-edit:hover { color: var(--primary); background: rgba(99, 102, 241, 0.1); }
    .item-src.editing { flex: 1 1 auto; overflow: visible; }
    .item-src-input {
      font-family: inherit; font-size: 12px; color: var(--font-color);
      width: 460px; max-width: 100%; padding: 1px 6px;
      border: 1px solid rgba(99, 102, 241, 0.45); border-radius: 6px;
      background: #fff; outline: none;
    }
    .item-src-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
    .item-head-agg { justify-content: space-between; }
    .item-count { font-size: 12px; color: var(--muted); flex: 0 0 auto; white-space: nowrap; }
    .item-src-group { display: inline-flex; align-items: center; gap: 10px; flex: 0 1 auto; min-width: 0; }
    .item-main-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; padding: 0; margin: 0;
      border: none; background: none; cursor: pointer;
      color: var(--muted); border-radius: 5px; flex: 0 0 auto; line-height: 0;
    }
    .item-main-btn:hover { color: var(--primary); background: rgba(99, 102, 241, 0.1); }
    .item-main {
      font-size: var(--main-font-size); line-height: var(--main-line-height); color: var(--font-color);
      background: var(--main-bg);
      border-left: 3px solid var(--main-border);
      border-radius: 6px; padding: 6px 10px; margin-bottom: 8px;
      white-space: pre-wrap; word-break: break-word;
    }
    .item-main-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .item-del { border: none; background: none; color: #9ca3af; cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 6px; flex: 0 0 auto; }
    .item-move { border: none; background: none; color: #9ca3af; cursor: pointer; font-size: 12px; padding: 0 5px; border-radius: 6px; flex: 0 0 auto; line-height: 1; height: 18px; min-width: 18px; display: inline-flex; align-items: center; justify-content: center; }
    .item-move svg { display: block; }
    .item-move:hover:not(:disabled) { color: var(--primary); background: rgba(99, 102, 241, 0.08); }
    .item-move:disabled { opacity: 0.35; cursor: default; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 16px 0; }
    .page-btn { border: 1px solid var(--border); background: #fff; color: var(--text); cursor: pointer; font-size: 13px; padding: 5px 14px; border-radius: 7px; margin-right: 5px; }
    .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .page-btn:disabled { opacity: 0.4; cursor: default; }
    .page-info { font-size: 13px; color: var(--muted); margin: 0 10px; display: inline-flex; align-items: center; gap: 6px; }
    .page-input { width: 52px; border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; font-size: 13px; color: var(--text); text-align: center; }
    .page-input:hover, .page-input:focus { border-color: var(--primary); outline: none; }
    .page-input::-webkit-outer-spin-button, .page-input::-webkit-inner-spin-button { opacity: 1; }

    /* 悬浮按钮组：跳到页首/页脚，贴在内容区（720px 列）外侧右边；窄屏回退到视口右下角 */
    .fab-group { position: fixed; left: calc(50% + 360px + 16px); bottom: 32px; display: flex; flex-direction: column; gap: 10px; z-index: 50; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s; }
    .fab-group.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
    @media (max-width: 820px) {
      .fab-group { left: auto; right: 16px; }
    }
    .fab-group.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .fab { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12); padding: 0; }
    .fab:hover { color: var(--primary); border-color: var(--primary); background: #fff; }
    .fab svg { display: block; }
    .item-del:hover { color: #dc2626; background: rgba(220,38,38,0.08); }

    .item-text {
      font-size: var(--font-size); font-weight: 600; color: var(--font-color);
      background: var(--quote-bg);
      border-radius: var(--quote-radius, 8px);
      padding: 6px 10px;
      margin-bottom: 8px;
      word-break: break-word;
      white-space: pre-wrap; /* 多行选中的换行要保留 */
    }
    /* 摘录记录：左侧深色竖线的引文样式，底色与主文不同 */
    .item-text-extract {
      background: var(--extract-bg) !important;
      border-left: 3px solid var(--extract-border);
      border-radius: var(--extract-radius, 0);
      padding-left: 12px;
      font-weight: normal;
    }
    .item-answer { font-size: var(--font-size); line-height: var(--line-height); color: var(--font-color); }
    /* 明细主文（多行选中原文）：默认模板按当前主文底色淡出；其它模板见 history.js 的 MAIN_DIM_CSS */
    .item-main-dim {
      background: var(--main-bg) !important;
      background: color-mix(in srgb, var(--main-bg) 40%, transparent) !important;
      border-left-color: var(--main-border) !important;
      border-left-color: color-mix(in srgb, var(--main-border) 35%, transparent) !important;
    }
    .item-answer p { margin: 4px 0; }
    .item-answer h1, .item-answer h2, .item-answer h3, .item-answer h4 { margin: 8px 0 4px; font-size: 14px; }
    .item-answer ul, .item-answer ol { margin: 4px 0; padding-left: 20px; }
    .item-answer li { margin: 2px 0; }
    .item-answer code {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
      font-size: 12px; background: rgba(99,102,241,0.08); color: #4f46e5;
      padding: 1px 4px; border-radius: 4px;
    }
    .item-answer pre { background: rgba(31,41,55,0.06); padding: 8px; border-radius: 8px; overflow-x: auto; margin: 6px 0; }
    .item-answer pre code { background: transparent; color: inherit; padding: 0; }
    .item-answer blockquote { margin: 6px 0; padding: 2px 10px; border-left: 3px solid #6366f1; color: #4b5563; }
    .item-answer a { color: #4f46e5; text-decoration: none; }
    .item-answer a:hover { text-decoration: underline; }

    .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 0; }
    .export-status { font-size: 13px; min-height: 0; margin: 6px 0 12px; }
    .export-status.ok { color: #16a34a; }
    .export-status.err { color: #dc2626; }
    #status { margin-top: 12px; font-size: 13px; min-height: 20px; }
    #status.ok { color: #16a34a; }
    #status.err { color: #dc2626; }

    /* 来源主文编辑弹窗 */
    .modal-mask {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(15, 23, 42, 0.35);
      align-items: center; justify-content: center;
      padding: 20px;
      display: none;
    }
    .modal-mask:not([hidden]) { display: flex; }
    .modal {
      width: min(560px, 100%);
      background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      padding: 16px 18px;
    }
    .modal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .modal-title { font-weight: 600; color: var(--text); font-size: 15px; }
    .modal-src { font-size: 12px; color: var(--muted); flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal-close { border: none; background: none; color: #9ca3af; font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
    .modal-close:hover { color: #dc2626; background: rgba(220, 38, 38, 0.08); }
    .modal textarea {
      width: 100%; min-height: 140px; resize: vertical;
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
      font-size: 14px; line-height: 1.6; color: var(--text);
      box-sizing: border-box;
    }
    .modal textarea:focus { outline: none; border-color: var(--primary); }
    .modal-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .modal-spacer { flex: 1; }
    .modal-import-info {
      font-size: 13px; color: var(--text); line-height: 1.7;
      background: var(--main-bg); border-radius: 10px; padding: 10px 12px;
      word-break: break-word;
    }
    .modal-import-info b { color: var(--primary); }
    .modal-import-info .dim { color: var(--muted); font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><span class="dot"></span>划词AI释义 · 历史记录<button type="button" class="clear-link" id="clear">清空记录</button><button type="button" class="icon-btn" id="refresh" title="刷新列表（保留当前搜索、时间范围与标签筛选）" aria-label="刷新">⟳</button></h1>
    <p class="sub">这里保存了你每次划词释义的原文与 AI 结果，可搜索、删除，也可一键导出为 HTML 或 Markdown 文件。</p>

    <div class="toolbar">
      <div class="search-wrap">
        <input type="text" id="search" class="search" placeholder="搜索原文、释义或来源" />
        <button type="button" class="search-clear" id="searchClear" title="清空搜索" aria-label="清空搜索">✕</button>
      </div>
      <span class="count" id="count"></span>
      <button class="primary" id="exportHtml">导出 HTML</button>
      <button class="ghost" id="previewPage" title="打开与导出 HTML 相同的页面，只预览、不弹打印窗口">预览</button>
      <button class="ghost" id="printPage" title="打开与导出 HTML 相同的页面并直接调起打印">打印</button>
      <button class="ghost" id="export">MD</button>
      <button class="ghost" id="toggleSettings" title="显示/隐藏设置区" aria-pressed="true">设置</button>
      <button class="ghost" id="toggleReadonly" title="切换只读模式：只读下列表卡片不显示任何操作图标" aria-pressed="false">只读</button>
      <input type="file" id="importFile" accept=".html,.htm,.json,text/html,application/json" hidden />

      <!-- 筛选与风格：和搜索工具栏同一张卡片，组内用细虚线分行 -->
      <div class="opts opts-group">
      <div class="opts timebar">
        <span class="opts-title">时间范围：</span>
        <label><input type="date" id="timeStart" title="筛选起始日期" /></label>
        <label><input type="date" id="timeEnd" title="筛选结束日期" /></label>
        <span class="quick-links">
          <a class="quick-link" data-range="today">当天</a><span class="quick-sep">|</span>
          <a class="quick-link" data-range="1d">1天</a><span class="quick-sep">|</span>
          <a class="quick-link" data-range="1w">1周</a><span class="quick-sep">|</span>
          <a class="quick-link" data-range="1m">1月</a>
        </span>
        <button type="button" class="reset-btn" id="timeClear">清除</button>
      </div>

      <div class="opts tagbar" id="tagBar" hidden>
        <span class="opts-title">标签： </span>
        <span class="tag-mode">
          <button type="button" class="tag-mode-btn active" id="tagModeOr" title="命中任意一个选中标签即显示">或</button>
          <button type="button" class="tag-mode-btn" id="tagModeAnd" title="必须同时带有全部选中标签才显示">且</button>
        </span>
        <div class="tag-filters" id="tagFilters"></div>
        <button type="button" class="reset-btn" id="tagClear">清除</button>
      </div>

      <!-- 风格模板常驻显示：不属于设置区，点「设置」隐藏设置时它仍在 -->
      <div class="opts tpl-row">
        <span class="opts-title">风格模板：<span class="info-dot" title="切换后立即生效，导出 HTML / 打印也按当前模板">ⓘ</span></span>
        <div class="tpl-bar" id="tplBar"></div>
      </div>

      <!-- 列表显示模式：常驻显示，不受「设置」与「样式设置」折叠影响 -->
      <div class="opts">
        <span class="opts-toggle-row">
          <button type="button" id="toggleMain" class="reset-btn">隐藏主文</button>
          <button type="button" id="toggleAgg" class="reset-btn">按来源聚合</button>
        </span>
      </div>
      </div>
    </div>
    <div id="exportStatus" class="export-status"></div>

    <div id="settingsArea">
    <!-- 设置区四块合成一张卡片（导出选项 / 备份数据 / 字体与颜色 / 样式管理），行间细虚线 -->
    <div class="opts opts-group">
    <div class="opts">
      <span class="opts-title">时间筛选：</span>
      <label class="opt-lbl">范围精度
        <select id="optTimeMode" title="选「日期」按天筛选；选「精确到秒」可按时分秒筛选">
          <option value="date">日期</option>
          <option value="second">精确到秒</option>

      </label>

    </div>
    <div class="opts">
      <span class="opts-title">导出时包含：</span>
      <label><input type="checkbox" id="optTime" checked />时间</label>
      <label><input type="checkbox" id="optPageTitle" checked />来源页面</label>
      <label><input type="checkbox" id="optPageUrl" checked />页面地址</label>
      <label><input type="checkbox" id="optCount" checked />条数</label>
      <label><input type="checkbox" id="optTags" checked />标签</label>
      <label><input type="checkbox" id="optSep" checked />分隔线</label>

      <span class="opts-title">导出为HTML：</span>
      <label><input type="checkbox" id="optNoSplit" />卡片不跨页拆分</label>
      <span class="opts-br"></span>
      <span class="opts-title">导出为MD：</span>
      <label><input type="checkbox" id="optCompact" />紧凑模式</label>
      <span class="opts-hint">时间在原文右边，无来源页面和地址</span>
    </div>
    <div class="opts">
      <span class="opts-title">备份数据：</span>
      <label><input type="checkbox" id="optBackup" title="勾选后，导出的 HTML 文件末尾会内嵌一份完整 JSON 备份，可在另一台电脑用「导入」精确还原历史记录" />导出 HTML 时内嵌备份</label>
      <button type="button" class="btn-mini" id="exportBackup" title="仅导出备份数据（JSON 文件），用于在另一台电脑导入还原">导出 JSON</button>
      <button type="button" class="btn-mini" id="import">导入</button>
    </div>
    <!-- 列表显示模式已随风格模板移到工具栏卡片，不在设置区内 -->
    <div class="opts panel-row">
      <button type="button" class="panel-toggle" id="styleToggle" aria-expanded="false" aria-controls="stylePanel" title="展开或折叠字体、颜色、圆角与样式管理">

        <span class="panel-toggle-state">打开</span>
        <span class="panel-toggle-tail" aria-hidden="true"></span>
      </button>
    </div>
    <div class="opts opt-panel" id="stylePanel" hidden>
      <label class="opt-lbl">字体 <select id="optFontPreset"></select></label>
      <label><input type="text" id="optFontFamily" placeholder="或输入自定义字体" spellcheck="false" /></label>

      <span class="bg-swatches" id="fontSwatches"></span>
      <span class="opts-br"></span>
      <label class="opt-lbl opt-rowstart">字体大小 <input type="range" id="optFontSize" min="12" max="20" step="1" value="13" /> <span id="optFontSizeVal">13</span>px</label>
      <label class="opt-lbl">行高 <input type="range" id="optLineHeight" min="1.0" max="2.4" step="0.1" value="1.2" /> <span id="optLineHeightVal">1.2</span></label>
      <label class="opt-lbl opt-rowstart">主文字号 <input type="range" id="optMainFontSize" min="11" max="20" step="1" value="13" /> <span id="optMainFontSizeVal">13</span>px</label>
      <label class="opt-lbl">主文行高 <input type="range" id="optMainLineHeight" min="1.0" max="2.4" step="0.1" value="1.7" /> <span id="optMainLineHeightVal">1.7</span></label>
      <label class="opt-lbl opt-rowstart">时间显示 <select id="optTimeDisplay" title="卡片与导出里的时间格式：到秒、到日，或精简的年/月/日">
        <option value="second">到秒</option>
        <option value="date">到日</option>
        <option value="short">精简 YY/M/D</option>
      </select></label>
      <span class="opts-br"></span>
      <span class="opts-title">页面背景色：</span>
      <label><input type="color" id="optPageBg" value="#eef2ff" /></label>
      <span class="bg-swatches" id="bgSwatches"></span>
      <span class="opts-br"></span>
      <span class="opts-title">原文背景色：</span>
      <label><input type="color" id="optQuoteBg" value="#e0e7ff" /></label>
      <span class="bg-swatches" id="quoteSwatches"></span>
      <span class="opts-br"></span>
      <span class="opts-title">主文背景色：</span>
      <label><input type="color" id="optMainBg" value="#f4f4fe" /></label>
      <span class="bg-swatches" id="mainSwatches"></span>
      <span class="opts-br"></span>
      <span class="opts-title">摘录背景色：</span>
      <label><input type="color" id="optExtractBg" value="#dcfce7" /></label>
      <span class="bg-swatches" id="extractSwatches"></span>
      <span class="opts-br"></span>
      <span class="opts-title">圆角设置：</span>
      <label class="opt-lbl">卡片 <input type="range" id="optCardRadius" min="0" max="24" step="1" value="16" /> <span id="optCardRadiusVal">16</span>px</label>
      <label class="opt-lbl">原文 <input type="range" id="optQuoteRadius" min="0" max="24" step="1" value="8" /> <span id="optQuoteRadiusVal">8</span>px</label>

      <span class="opts-title">样式管理：</span>

      <label>样式组 <select id="presetSelect"></select></label>

    </div>
    </div>

    <div id="list"></div>
    <div id="pager"></div>
    <div id="status"></div>
  </div>

  <div class="fab-group" id="fabGroup">

    <button type="button" class="fab" id="fabBottom" title="跳到页脚" aria-label="跳到页脚">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
    </button>
  </div>

  <div class="modal-mask" id="mainModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title">来源主文</span>
        <span class="modal-src" id="mainModalSrc"></span>
        <button type="button" class="modal-close" id="mainModalClose" title="关闭">✕</button>
      </div>
      <textarea id="mainModalText" spellcheck="false" placeholder="为这个来源填写一段主文，保存后该来源的所有历史记录都会显示它…"></textarea>
      <div class="modal-foot">
        <button type="button" class="danger" id="mainModalClear">清除</button>
        <span class="modal-spacer"></span>
        <button type="button" class="ghost" id="mainModalCancel">取消</button>
        <button type="button" class="primary" id="mainModalSave">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="importModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title">导入历史记录</span>
        <button type="button" class="modal-close" id="importModalClose" title="关闭">✕</button>
      </div>
      <div class="modal-import-info" id="importModalInfo"></div>
      <div class="modal-foot">
        <button type="button" class="danger" id="importReplace">覆盖导入</button>
        <span class="modal-spacer"></span>
        <button type="button" class="ghost" id="importCancel">取消</button>
        <button type="button" class="primary" id="importMerge">合并导入</button>
      </div>
    </div>
  </div>

  <script src="history.js"></script>
</body>
</html>
