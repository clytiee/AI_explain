<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>划词AI释义 · 历史记录</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-soft: rgba(99, 102, 241, 0.12);
      --border: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --page-bg: #eef2ff;
      --quote-bg: #e0e7ff;
      --font-color: #1f2937;
      --font-size: 13px;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Roboto, sans-serif;
      --line-height: 1.2;
      --main-bg: #f4f4fe;
      --main-border: #6366f1;
      --extract-bg: #dcfce7;
      --extract-border: #39ac61;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-family);
      color: var(--font-color);
      font-size: var(--font-size);
      background: var(--page-bg);
      min-height: 100vh;
      padding: 32px 16px 60px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
    h1 .clear-link {
      margin-left: auto; font-size: 12px; font-weight: 400; color: var(--muted);
      border: none; background: none; cursor: pointer; padding: 3px 8px; border-radius: 6px;
    }
    h1 .clear-link:hover { color: #dc2626; background: rgba(220, 38, 38, 0.08); }
    h1 .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
    }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }

    .toolbar {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }
    .search-wrap { position: relative; flex: 1 1 220px; min-width: 160px; }
    .search {
      width: 100%;
      padding: 8px 30px 8px 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    .search:focus { border-color: var(--primary); }
    .search-clear {
      position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
      display: none; align-items: center; justify-content: center;
      width: 20px; height: 20px; padding: 0;
      border: none; background: none; cursor: pointer;
      color: var(--muted); font-size: 13px; line-height: 1; border-radius: 50%;
    }
    .search-clear:hover { color: var(--text); background: rgba(0, 0, 0, 0.06); }
    .count { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .opts {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      column-gap: 14px; row-gap: 6px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 12px;
      padding: 10px 16px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .opts.timebar { overflow: visible; }
    .opts.timebar .opts-hint { flex: 0 0 auto; color: var(--primary); font-size: 12px; }
    .opts.timebar .quick-links { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; }
    .opts.timebar .quick-link { cursor: pointer; color: var(--muted); text-decoration: none; width: 25px; text-align: center; border-radius: 5px; }
    .opts.timebar .quick-link:hover { color: var(--primary); background: rgba(99, 102, 241, 0.1); }
    .opts.timebar .quick-sep { color: var(--border); }
    .opts-title {
      color: var(--muted); font-size: 12px;
      width: 88px; flex-shrink: 0;
    }
    .opts-br { flex-basis: 100%; width: 100%; height: 0; }
    .opts-sep { border-top: 1px dashed var(--border); margin: 5px 0;}
    .opts-toggle-row {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 14px; flex-basis: 100%;
    }
    .opts label {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--text); cursor: pointer; user-select: none;
    }
    .opts input { accent-color: var(--primary); cursor: pointer; }
    /* 设置控件：与搜索框一致的浅色外观 */
    .opts select,
    .opts input[type="text"],
    .opts input[type="datetime-local"] {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 13px;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }
    .opts select:focus,
    .opts input[type="text"]:focus,
    .opts input[type="datetime-local"]:focus { border-color: var(--primary); }
    .opts input[type="color"] {
      width: 40px; height: 26px; padding: 2px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 7px;
      cursor: pointer;
    }
    .opts input[type="range"] { width: 100px; }
    .opts-hint { color: var(--muted); font-size: 12px; }
    .opts .reset-btn {
      border: 1px solid var(--border); background: #fff; color: var(--muted);
      font-size: 12px; padding: 4px 10px; border-radius: 7px; cursor: pointer;
    }
    .opts .reset-btn:hover { color: var(--primary); border-color: var(--primary); }
    .opts .reset-btn.active { color: var(--primary); border-color: var(--primary); background: rgba(99, 102, 241, 0.08); }
    .opts .btn-mini {
      border: 1px solid var(--border); background: #fff; color: var(--muted);
      font-size: 11px; padding: 1px 7px; border-radius: 6px; cursor: pointer; line-height: 1.6;
    }
    .opts .btn-mini:hover { color: var(--primary); border-color: var(--primary); }
    .agg-items { display: flex; flex-direction: column; gap: 10px; }
    .agg-item { border-top: 1px dashed rgba(99, 102, 241, 0.28); padding-top: 10px; }
    .agg-item:first-child { border-top: none; padding-top: 0; }
    .agg-item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .agg-item-time { font-size: 12px; color: var(--muted); flex: 1 1 auto; white-space: nowrap; }
    .bg-swatches { display: inline-flex; gap: 4px; align-items: center; }
    .bg-swatch {
      width: 16px; height: 16px; padding: 0; border-radius: 4px; cursor: pointer;
      border: 1px solid rgba(0, 0, 0, 0.12); flex: 0 0 auto;
    }
    .bg-swatch:hover { transform: scale(1.15); }
    .bg-swatch.active { outline: 2px solid var(--primary); outline-offset: 1px; }
    /* 显示设置第一行：字体/字体颜色/字体大小 缩窄 */
    #optFontPreset { max-width: 132px; }
    #optFontFamily { width: 150px; }
    #presetSelect { min-width: 260px; }

    button.primary, button.ghost, button.danger {
      border: none; cursor: pointer; font-size: 13px;
      padding: 9px 16px; border-radius: 9px; transition: 0.15s; white-space: nowrap;
    }
    button.primary { background: var(--primary); color: #fff; }
    button.primary:hover { background: #4338ca; }
    button.ghost { background: var(--primary-soft); color: var(--primary); }
    button.ghost:hover { background: rgba(99, 102, 241, 0.2); }
    button.danger { background: rgba(220, 38, 38, 0.1); color: #dc2626; }
    button.danger:hover { background: rgba(220, 38, 38, 0.18); }

    .card {
      background: rgba(255, 255, 255, 0.88);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: var(--card-radius, 16px);
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
    }
    .item-head {
      display: flex; align-items: center; gap: 10px; flex-wrap: nowrap;
      margin-bottom: 8px;
    }
    .item-time { font-size: 12px; color: var(--muted); flex: 1 0 auto; white-space: nowrap; }
    .item-src {
      font-size: 12px; color: var(--muted); flex: 0 1 auto;
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .item-src a { color: var(--muted); text-decoration: none; }
    .item-src a:hover { color: var(--primary); text-decoration: underline; }
    .item-src-search {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; padding: 0; margin: 0;
      border: none; background: none; cursor: pointer;
      color: var(--muted); border-radius: 5px; flex: 0 0 auto;
    }
    .item-src-search:hover { color: var(--primary); background: rgba(99, 102, 241, 0.1); }
    .item-head-agg { justify-content: space-between; }
    .item-count { font-size: 12px; color: var(--muted); flex: 0 0 auto; white-space: nowrap; }
    .item-src-group { display: inline-flex; align-items: center; gap: 10px; flex: 0 1 auto; min-width: 0; }
    .item-main-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; padding: 0; margin: 0;
      border: none; background: none; cursor: pointer;
      color: var(--muted); border-radius: 5px; flex: 0 0 auto; line-height: 0;
    }
    .item-main-btn:hover { color: var(--primary); background: rgba(99, 102, 241, 0.1); }
    .item-main {
      font-size: 13px; color: var(--font-color);
      background: var(--main-bg);
      border-left: 3px solid var(--main-border);
      border-radius: 6px; padding: 6px 10px; margin-bottom: 8px;
      white-space: pre-wrap; word-break: break-word;
    }
    .item-main-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .item-del { border: none; background: none; color: #9ca3af; cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 6px; flex: 0 0 auto; }
    .item-move { border: none; background: none; color: #9ca3af; cursor: pointer; font-size: 12px; padding: 0 5px; border-radius: 6px; flex: 0 0 auto; line-height: 1; height: 18px; min-width: 18px; display: inline-flex; align-items: center; justify-content: center; }
    .item-move svg { display: block; }
    .item-move:hover:not(:disabled) { color: var(--primary); background: rgba(99, 102, 241, 0.08); }
    .item-move:disabled { opacity: 0.35; cursor: default; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 16px 0; }
    .page-btn { border: 1px solid var(--border); background: #fff; color: var(--text); cursor: pointer; font-size: 13px; padding: 5px 14px; border-radius: 7px; }
    .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .page-btn:disabled { opacity: 0.4; cursor: default; }
    .page-info { font-size: 13px; color: var(--muted); margin: 0 10px;}
    .item-del:hover { color: #dc2626; background: rgba(220,38,38,0.08); }

    .item-text {
      font-size: var(--font-size); font-weight: 600; color: var(--font-color);
      background: var(--quote-bg);
      border-radius: var(--quote-radius, 8px);
      padding: 6px 10px;
      margin-bottom: 8px;
      word-break: break-word;
    }
    /* 摘录记录：左侧深色竖线的引文样式，底色与主文不同 */
    .item-text-extract {
      background: var(--extract-bg) !important;
      border-left: 3px solid var(--extract-border);
      border-radius: var(--extract-radius, 0);
      padding-left: 12px;
      font-weight: normal;
    }
    .item-answer { font-size: var(--font-size); line-height: var(--line-height); color: var(--font-color); }
    .item-answer p { margin: 4px 0; }
    .item-answer h1, .item-answer h2, .item-answer h3, .item-answer h4 { margin: 8px 0 4px; font-size: 14px; }
    .item-answer ul, .item-answer ol { margin: 4px 0; padding-left: 20px; }
    .item-answer li { margin: 2px 0; }
    .item-answer code {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
      font-size: 12px; background: rgba(99,102,241,0.08); color: #4f46e5;
      padding: 1px 4px; border-radius: 4px;
    }
    .item-answer pre { background: rgba(31,41,55,0.06); padding: 8px; border-radius: 8px; overflow-x: auto; margin: 6px 0; }
    .item-answer pre code { background: transparent; color: inherit; padding: 0; }
    .item-answer blockquote { margin: 6px 0; padding: 2px 10px; border-left: 3px solid #6366f1; color: #4b5563; }
    .item-answer a { color: #4f46e5; text-decoration: none; }
    .item-answer a:hover { text-decoration: underline; }

    .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 0; }
    .export-status { font-size: 13px; min-height: 0; margin: 6px 0 12px; }
    .export-status.ok { color: #16a34a; }
    .export-status.err { color: #dc2626; }
    #status { margin-top: 12px; font-size: 13px; min-height: 20px; }
    #status.ok { color: #16a34a; }
    #status.err { color: #dc2626; }

    /* 来源主文编辑弹窗 */
    .modal-mask {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(15, 23, 42, 0.35);
      align-items: center; justify-content: center;
      padding: 20px;
      display: none;
    }
    .modal-mask:not([hidden]) { display: flex; }
    .modal {
      width: min(560px, 100%);
      background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      padding: 16px 18px;
    }
    .modal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .modal-title { font-weight: 600; color: var(--text); font-size: 15px; }
    .modal-src { font-size: 12px; color: var(--muted); flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal-close { border: none; background: none; color: #9ca3af; font-size: 14px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
    .modal-close:hover { color: #dc2626; background: rgba(220, 38, 38, 0.08); }
    .modal textarea {
      width: 100%; min-height: 140px; resize: vertical;
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
      font-size: 14px; line-height: 1.6; color: var(--text);
      box-sizing: border-box;
    }
    .modal textarea:focus { outline: none; border-color: var(--primary); }
    .modal-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .modal-spacer { flex: 1; }
    .modal-import-info {
      font-size: 13px; color: var(--text); line-height: 1.7;
      background: var(--main-bg); border-radius: 10px; padding: 10px 12px;
      word-break: break-word;
    }
    .modal-import-info b { color: var(--primary); }
    .modal-import-info .dim { color: var(--muted); font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><span class="dot"></span>划词AI释义 · 历史记录<button type="button" class="clear-link" id="clear">清空记录</button></h1>
    <p class="sub">这里保存了你每次划词释义的原文与 AI 结果，可搜索、删除，也可一键导出为 HTML 或 Markdown 文件。</p>

    <div class="toolbar">
      <div class="search-wrap">
        <input type="text" id="search" class="search" placeholder="搜索原文、释义或来源页面…" />
        <button type="button" class="search-clear" id="searchClear" title="清空搜索" aria-label="清空搜索">✕</button>
      </div>
      <span class="count" id="count"></span>
      <button class="primary" id="exportHtml">导出 HTML</button>
      <button class="ghost" id="export">导出 MD</button>
      <button class="ghost" id="toggleSettings">隐藏设置</button>
      <input type="file" id="importFile" accept=".html,.htm,text/html" hidden />
    </div>
    <div id="exportStatus" class="export-status"></div>

    <div class="opts timebar">
      <span class="opts-title">时间范围：</span>
      <label><input type="datetime-local" id="timeStart" step="1" title="筛选起始时间（精确到秒）" /></label>
      <label><input type="datetime-local" id="timeEnd" step="1" title="筛选结束时间（精确到秒）" /></label>
      <span class="quick-links">
        <a class="quick-link" data-range="today">当天</a><span class="quick-sep">|</span>
        <a class="quick-link" data-range="1d">1天</a><span class="quick-sep">|</span>
        <a class="quick-link" data-range="1w">1周</a><span class="quick-sep">|</span>
        <a class="quick-link" data-range="1m">1月</a>
      </span>
      <button type="button" class="reset-btn" id="timeClear">清除</button>
      
    </div>

    <div id="settingsArea">
    <div class="opts">
      <span class="opts-title">导出时包含：</span>
      <label><input type="checkbox" id="optTime" checked />时间</label>
      <label><input type="checkbox" id="optPageTitle" checked />来源页面</label>
      <label><input type="checkbox" id="optPageUrl" checked />页面地址</label>
      <label><input type="checkbox" id="optCount" checked />条数</label>
      <label><input type="checkbox" id="optSep" checked />分隔线</label>
      <label><input type="checkbox" id="optBackup" title="勾选后，导出的 HTML 文件末尾会内嵌一份完整 JSON 备份，可在另一台电脑用「导入」精确还原历史记录" />备份数据</label>
      <button type="button" class="btn-mini" id="import">导入</button>
      <span class="opts-br"></span>
      <span class="opts-title">导出为HTML：</span>
      <label><input type="checkbox" id="optNoSplit" />卡片不跨页拆分</label>
      <span class="opts-br"></span>
      <span class="opts-title">导出为MD：</span>
      <label><input type="checkbox" id="optCompact" />紧凑模式</label>
      <span class="opts-hint">时间在原文右边，无来源页面和地址</span>
    </div>
    <div class="opts">
      <span class="opts-title">显示设置：</span>
      <label>字体 <select id="optFontPreset"></select></label>
      <label><input type="text" id="optFontFamily" placeholder="或输入自定义字体" spellcheck="false" /></label>
      <label>字体颜色 <input type="color" id="optFontColor" value="#1f2937" /></label>
      <span class="bg-swatches" id="fontSwatches"></span>
      <label>字体大小 <input type="range" id="optFontSize" min="12" max="20" step="1" value="13" /> <span id="optFontSizeVal">13</span>px</label>
      <label>行高 <input type="range" id="optLineHeight" min="1.0" max="2.4" step="0.1" value="1.2" /> <span id="optLineHeightVal">1.2</span></label>
      <span class="opts-br"></span>
      <span class="opts-title">页面背景色：</span>
      <label><input type="color" id="optPageBg" value="#eef2ff" /></label>
      <span class="bg-swatches" id="bgSwatches"></span>
      <span class="opts-br"></span>
      <span class="opts-title">原文背景色：</span>
      <label><input type="color" id="optQuoteBg" value="#e0e7ff" /></label>
      <span class="bg-swatches" id="quoteSwatches"></span>
      <span class="opts-br"></span>
      <span class="opts-title">主文背景色：</span>
      <label><input type="color" id="optMainBg" value="#f4f4fe" /></label>
      <span class="bg-swatches" id="mainSwatches"></span>
      <span class="opts-br"></span>
      <span class="opts-title">摘录背景色：</span>
      <label><input type="color" id="optExtractBg" value="#dcfce7" /></label>
      <span class="bg-swatches" id="extractSwatches"></span>
      <span class="opts-br"></span>
      <span class="opts-title">圆角设置：</span>
      <label>卡片 <input type="range" id="optCardRadius" min="0" max="24" step="1" value="16" /> <span id="optCardRadiusVal">16</span>px</label>
      <label>原文 <input type="range" id="optQuoteRadius" min="0" max="24" step="1" value="8" /> <span id="optQuoteRadiusVal">8</span>px</label>
      <label>摘录 <input type="range" id="optExtractRadius" min="0" max="24" step="1" value="0" /> <span id="optExtractRadiusVal">0</span>px</label>
      <span class="opts-br"></span>
      <span class="opts-title">样式管理：</span>
      <button type="button" id="saveDisplay" class="reset-btn">保存显示设置</button>
      <label>样式组 <select id="presetSelect"></select></label>
      <button type="button" id="deletePreset" class="reset-btn">删除</button>
      <button type="button" id="resetDisplay" class="reset-btn">恢复默认</button>
      <span class="opts-br opts-sep"></span>
      <span class="opts-toggle-row">
        <button type="button" id="toggleMain" class="reset-btn">隐藏主文</button>
        <button type="button" id="toggleAgg" class="reset-btn">按来源聚合</button>
      </span>
    </div>
    </div>

    <div id="list"></div>
    <div id="pager"></div>
    <div id="status"></div>
  </div>

  <div class="modal-mask" id="mainModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title">来源主文</span>
        <span class="modal-src" id="mainModalSrc"></span>
        <button type="button" class="modal-close" id="mainModalClose" title="关闭">✕</button>
      </div>
      <textarea id="mainModalText" spellcheck="false" placeholder="为这个来源填写一段主文，保存后该来源的所有历史记录都会显示它…"></textarea>
      <div class="modal-foot">
        <button type="button" class="danger" id="mainModalClear">清除</button>
        <span class="modal-spacer"></span>
        <button type="button" class="ghost" id="mainModalCancel">取消</button>
        <button type="button" class="primary" id="mainModalSave">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="importModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title">导入历史记录</span>
        <button type="button" class="modal-close" id="importModalClose" title="关闭">✕</button>
      </div>
      <div class="modal-import-info" id="importModalInfo"></div>
